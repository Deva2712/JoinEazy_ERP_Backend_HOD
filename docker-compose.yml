services:
  # ─── PostgreSQL Database ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: joineazy_hod_dev
      POSTGRES_USER: joineazy_hod_user
      POSTGRES_PASSWORD: joineazy_hod_pass
    ports:
      - "192.168.0.104:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joineazy_hod_user -d joineazy_hod_dev"]
      interval: 2s
      timeout: 5s
      retries: 10
  # ─── HOD Backend API ────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        NODE_ENV: development
    env_file:
      - .env
    ports:
      - "192.168.0.104:${PORT}:${PORT}"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      - RUN_SCRIPT=${RUN_SCRIPT}
      - WATCHPACK_POLLING=${WATCHPACK_POLLING}
      - CORS_ORIGIN=${CORS_ORIGIN}
      # ── Database ────────────────────────────────────────────────────────
      - DATABASE_DIALECT=${DATABASE_DIALECT}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_PORT=${DATABASE_PORT}
      # ── JWT ─────────────────────────────────────────────────────────────
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      # ── Email (SMTP) ────────────────────────────────────────────────────
      - SMTP_HOST_NR=${SMTP_HOST_NR}
      - SMTP_PORT_NR=${SMTP_PORT_NR}
      - SMTP_SECURE_NR=${SMTP_SECURE_NR}
      - SMTP_USERNAME_NR=${SMTP_USERNAME_NR}
      - SMTP_PASSWORD_NR=${SMTP_PASSWORD_NR}
      # ── AWS ─────────────────────────────────────────────────────────────
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_S3_ENDPOINT=${AWS_S3_ENDPOINT}
      # ── Monitoring ──────────────────────────────────────────────────────
      - MONITORING_TOKEN=${MONITORING_TOKEN}
    volumes:
      - ./logs:/app/logs
    stdin_open: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data: